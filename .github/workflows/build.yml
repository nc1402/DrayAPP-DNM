name: Build DNM Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -f "$sdk/platforms/android-35/android.jar" || ! -d "$sdk/build-tools/35.0.0" ]]; then
            sdkmanager --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          test -f "$sdk/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DNM-Android-v0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
